name: kb-data collect

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  collect:
    # 防自触发死循环：机器人自己提交的 data 提交不再触发
    if: ${{ !startsWith(github.event.head_commit.message || '', 'data ') }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: collect
        run: python3 collect.py

      - name: 单提交覆盖（不涨历史）
        run: |
          git config user.name "kblab-bot"
          git config user.email "bot@localhost"
          git checkout --orphan tmp
          git add -A
          git commit -m "data $(date -u +%F_%H:%M)" || echo "no change"
          git branch -M main
          git push -f origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
